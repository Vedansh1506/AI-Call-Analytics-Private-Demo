[mypy]
python_version = 3.12
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True

[mypy-utils.config]
ignore_errors = True

[mypy-routers.*]
ignore_errors = True

[mypy-background_services.process_asset]
ignore_errors = True

[mypy-background_services.tasks]
ignore_errors = True
