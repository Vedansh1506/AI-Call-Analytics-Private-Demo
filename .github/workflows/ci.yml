name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      SECRET_KEY: ci-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ASSEMBLYAI_API_KEY: dummy
      GEMINI_API_KEY: dummy
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: 60
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: 10
      AUTH_LOCKOUT_SECONDS: 900
      AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS: 5
      PYTHONPATH: "."
      SMTP_USER: test
      SMTP_PASSWORD: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov ruff mypy
      - run: ruff check main.py routers background_services utils tests
      - run: mypy tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
